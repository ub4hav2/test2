name: Build NexusOS Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: npm install --no-audit --no-fund 2>&1 | tee -a build-output.txt

      - name: Build installer
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run dist 2>&1 | tee -a build-output.txt

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0
          name: NexusOS 2.5.0
          body: |
            NexusOS Enterprise — сетевой сканер.
            Установщик: NexusOS-Setup-2.5.0.exe — скачайте и запустите.
          files: dist/NexusOS-Setup-*.exe
          fail_on_unmatched_files: true

      - name: Capture diagnostics on failure
        if: failure()
        shell: bash
        run: |
          git config user.email "ci@local"
          git config user.name "ci"
          git checkout --orphan diag
          git rm -rf --cached . >/dev/null 2>&1 || true
          cp build-output.txt diag-build-output.txt || echo "no output file" > diag-build-output.txt
          git add -f diag-build-output.txt
          git commit -m "diag $(date)" >/dev/null 2>&1 || true
          git push -f origin diag
